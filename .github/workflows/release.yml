name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build extension zip
        run: sh platforms/gnome/scripts/package-ego-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: |
            platforms/gnome/dist/*.zip
            platforms/gnome/dist/*.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          zip_path=$(find platforms/gnome/dist -maxdepth 1 -name '*.zip' -print -quit)
          sha256_path=$(find platforms/gnome/dist -maxdepth 1 -name '*.zip.sha256' -print -quit)
          gh release create "$tag" "$zip_path" "$sha256_path" \
            --title "${tag}" \
            --generate-notes
